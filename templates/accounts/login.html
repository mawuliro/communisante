{% extends "base.html" %}
{% load i18n crispy_forms_tags %}

{% block title %}{% trans "Log in" %} | {{ block.super }}{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6 sm:p-8">
    <h1 class="text-2xl font-bold text-emerald-800 mb-6">{% trans "Log in" %}</h1>
    <form method="post" action="" class="space-y-4" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="w-full min-h-[48px] rounded-lg bg-emerald-600 text-white font-semibold hover:bg-emerald-700">
            {% trans "Continue" %}
        </button>
    </form>
    <p class="mt-6 text-sm text-slate-600 text-center">
        <a href="{% url 'core:home' %}" class="text-emerald-700 underline">{% trans "Back to home" %}</a>
    </p>
</div>
{% endblock %}
