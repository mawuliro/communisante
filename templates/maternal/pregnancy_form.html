{% extends "base.html" %}
{% load i18n crispy_forms_tags %}

{% block title %}{{ form_title }} | {{ block.super }}{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6 sm:p-8 space-y-6">
    <h1 class="text-2xl font-bold text-emerald-800">{{ form_title }}</h1>
    <form method="post" novalidate class="space-y-4">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="flex flex-col sm:flex-row gap-3 pt-2">
            <button type="submit" class="min-h-[48px] px-6 rounded-lg bg-emerald-600 text-white font-semibold hover:bg-emerald-700">
                {% trans "Save" %}
            </button>
            <a href="{% if object %}{% url 'maternal:pregnancy_detail' object.pk %}{% else %}{% url 'maternal:pregnancy_list' %}{% endif %}"
               class="inline-flex justify-center items-center min-h-[48px] px-6 rounded-lg border border-slate-300 text-slate-800 font-medium hover:bg-slate-50">
                {% trans "Cancel" %}
            </a>
        </div>
    </form>
</div>
{% endblock %}
