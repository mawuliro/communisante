{% extends "base.html" %}
{% load i18n crispy_forms_tags %}

{% block title %}{{ form_title }} | {{ block.super }}{% endblock %}

{% block content %}
<div class="bg-white/95 rounded-3xl border border-slate-200/80 shadow-soft p-6 sm:p-8 lg:p-10 space-y-6">
    <h1 class="text-2xl sm:text-3xl font-bold text-emerald-900 tracking-tight">{{ form_title }}</h1>
    <form method="post" novalidate class="space-y-4"
          {% if object %}data-offline-kind="pregnancy_update" data-offline-pregnancy-pk="{{ object.pk }}"{% else %}data-offline-kind="pregnancy_create"{% endif %}>
        {% csrf_token %}
        {{ form|crispy }}
        <div class="flex flex-col sm:flex-row gap-3 pt-2">
            <button type="submit" class="min-h-[52px] px-8 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-semibold shadow-soft hover:from-emerald-700 hover:to-teal-700 transition-all">
                {% trans "Save" %}
            </button>
            <a href="{% if object %}{% url 'maternal:pregnancy_detail' object.pk %}{% else %}{% url 'maternal:pregnancy_list' %}{% endif %}"
               class="inline-flex justify-center items-center min-h-[52px] px-8 rounded-2xl border-2 border-slate-200 bg-white text-slate-800 font-semibold hover:bg-slate-50 transition-colors">
                {% trans "Cancel" %}
            </a>
        </div>
    </form>
</div>
{% endblock %}
