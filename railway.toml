# Config as code — overrides dashboard settings. See:
# https://docs.railway.com/config-as-code/reference
#
# - collectstatic runs at BUILD only (baked into the image).
# - Do not run collectstatic in Railway pre-deploy (ephemeral FS, not kept).
# - Heroku-style Procfile `release:` is not a reliable migration hook on Railway;
#   use preDeployCommand for migrate (DB only, no FS needed).

[build]
# CSS: run `npm ci && npm run build:css` locally when templates change; `static/css/communisante.css` is versioned.
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput --settings=communisante.settings.build_static"

[deploy]
# Static files are already in the image from [build]; --preload loads Django once before workers fork (faster ready).
startCommand = "python -m gunicorn communisante.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --preload"
# Railway allows at most one element (one shell command), not argv-style tokens.
preDeployCommand = ["python manage.py migrate --noinput --settings=communisante.settings.prod"]
# No HTTP healthcheck: avoids deploy failures if /health/ misbehaves. Clear "Healthcheck Path"
# in Railway → Service → Settings if an old value is still applied from the dashboard.
